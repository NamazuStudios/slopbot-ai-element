# The element's own CI: build + test the Kotlin element on every PR and main
# push. The .elm artifact uploads on main (the deployable artifact; the pod
# repo's worker image consumes the element's release, so keep main green).
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-elm:
    name: Build + test element
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # Kotlin 2.1 rejects newer JDKs outright
          cache: maven
      - name: Build + verify
        run: mvn -B --no-transfer-progress verify
      - name: Upload the .elm (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-elm
          path: element/target/*.elm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Tag + release .elm
    needs: build-elm
    # Every main push gets a tagged GitHub Release carrying the .elm — the
    # durable, downloadable artifact (the fake-the-music-server pattern). No
    # more local builds: deployments consume the release.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the built .elm
        uses: actions/download-artifact@v4
        with:
          name: deployment-elm
          path: dist
      - name: Compute the release tag
        id: tag
        run: echo "tag=deploy-${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create + push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.tag.outputs.tag }} already exists — skipping (a rerun)."
          else
            git tag -a "${{ steps.tag.outputs.tag }}" -m "SlopBot element build ${{ steps.tag.outputs.tag }}"
            git push origin "${{ steps.tag.outputs.tag }}"
          fi
      - name: Publish the GitHub Release with the .elm
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SlopBot element ${{ steps.tag.outputs.tag }}
          files: dist/*.elm
          fail_on_unmatched_files: true
