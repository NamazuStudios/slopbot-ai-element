<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slopbot.gg — Deck</title>
<link rel="stylesheet" href="slopbot-ui.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: .8rem 1.2rem;
    border-bottom: 1px solid var(--line);
    background: rgba(7, 11, 34, .6);
  }
  header .left { display: flex; align-items: center; gap: .8rem; }
  header .logo { font-size: 1rem; }
  header .hint { color: var(--muted); font-size: .8rem; }
  header .right { display: flex; gap: .5rem; align-items: center; }
  header .back { color: var(--muted); text-decoration: none; font-size: .85rem; }
  header .back:hover { color: #fff; }

  /* The deck grid: registry left (full height); right column = generation
     queue on top, playback queue below. */
  .deck-grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: .9rem;
    padding: .9rem 1.2rem 1.2rem;
  }
  .deck-grid .card { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #pane-registry { grid-row: 1 / 3; }

  .list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: .55rem; padding-right: .2rem; }
  .item {
    border: 1px solid var(--line); border-radius: 10px;
    padding: .55rem .7rem;
    background: rgba(10, 15, 44, .55);
    display: flex; align-items: center; gap: .7rem;
  }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: .93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t span { color: var(--muted); font-size: .78rem; }
  .item .act { flex: none; }
  .item button {
    border: 0; border-radius: 8px; padding: .35rem .8rem; font-weight: 700; font-size: .8rem;
    background: rgba(255, 0, 153, .18); color: var(--pink-soft); cursor: pointer;
  }
  .item button:hover { background: rgba(255, 0, 153, .3); color: #fff; }
  .item .st { font-size: .72rem; }
  .empty { color: #6d76a8; font-size: .85rem; padding: 1rem .2rem; text-align: center; }
  .badge {
    flex: none; min-width: 22px; height: 22px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--line); color: var(--muted); font-size: .75rem; font-weight: 700;
  }
  .gen .item { border-color: rgba(255, 200, 87, .25); }
  .gen .item .st { color: var(--warn); }
  .count { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<header>
  <div class="left">
    <div class="logo">slopbot<em>.gg</em> · deck</div>
    <span class="chip"><span class="dot"></span> live</span>
    <span class="hint" id="conn-hint">on-screen · keep this tab on the capture</span>
  </div>
  <div class="right">
    <span class="count" id="counts"></span>
    <a class="back" href="dashboard.html">← dashboard</a>
  </div>
</header>

<main class="deck-grid">
  <section class="card" id="pane-registry">
    <h3>Slop Registry <span class="count" id="reg-count"></span></h3>
    <div class="list" id="registry-list"></div>
  </section>

  <section class="card gen" id="pane-generation">
    <h3>Generation Queue <span class="count" id="gen-count"></span></h3>
    <div class="list" id="generation-list"></div>
  </section>

  <section class="card" id="pane-playback">
    <h3>Playback Queue <span class="count" id="play-count"></span></h3>
    <div class="list" id="playback-list"></div>
  </section>
</main>

<script>
  // Session-gated (unique to the logged-in streamer): no session → landing.
  fetch('/slop/api/me').then((r) => {
    if (r.status === 401) location.href = 'index.html?login=required';
  }).catch(() => {});
</script>
<script src="slop-confirm.js"></script>
<script src="deck-lite.js"></script>
</body>
</html>
